<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="reader-styles.css">
  <title>小说阅读器</title>
</head>
<body>
  <div id="app" class="app-shell">
    <main id="library-view" class="library-view">
      <header class="library-header">
        <div>
          <p class="eyebrow">本地书架</p>
          <h1>我的阅读</h1>
        </div>
        <div class="header-actions">
          <button id="sort-btn" class="icon-button" type="button" aria-label="切换排序">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
          </button>
          <button id="import-btn" class="primary-button compact-import" type="button" aria-label="导入小说">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </header>

      <section id="continue-card" class="continue-card hidden" aria-label="继续阅读"></section>

      <section class="section-head">
        <h2>书库</h2>
        <span id="book-count">0 本</span>
      </section>
      <section id="book-grid" class="book-grid"></section>
      <section id="empty-state" class="empty-state">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9a3 3 0 0 1 3 3v13H8a2 2 0 0 1-2-2V4z"/><path d="M8 18h10"/></svg>
        <h2>还没有书</h2>
        <p>导入 TXT 小说后，会自动识别章节并保存阅读进度。</p>
        <button id="empty-import-btn" class="primary-button" type="button">导入小说</button>
      </section>
    </main>

    <main id="reader-view" class="reader-view" aria-label="阅读器">
      <div id="reader-scroll" class="reader-scroll">
        <article id="reader-content" class="reader-content"></article>
      </div>
      <div id="reader-topbar" class="reader-topbar">
        <button id="back-btn" class="reader-control" type="button" aria-label="返回书架">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <div class="reader-title-wrap">
          <strong id="reader-book-title">未选择书籍</strong>
          <span id="reader-chapter-title">章节</span>
        </div>
        <div class="reader-top-actions">
          <button id="settings-btn" class="reader-control" type="button" aria-label="阅读设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 8h14M7 16h10"/></svg>
          </button>
          <button id="toc-btn" class="reader-control" type="button" aria-label="目录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
          </button>
        </div>
      </div>
      <div id="reader-bottombar" class="reader-bottombar">
        <button id="prev-btn" class="reader-control" type="button" aria-label="上一章或上一页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <div class="progress-area">
          <span id="progress-label">0%</span>
          <input id="progress-range" type="range" min="0" max="1000" value="0" aria-label="阅读进度">
        </div>
        <button id="next-btn" class="reader-control" type="button" aria-label="下一章或下一页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div id="page-indicator" class="page-indicator" aria-hidden="true"></div>
    </main>

    <aside id="settings-sheet" class="bottom-sheet" aria-label="阅读设置">
      <div class="sheet-grabber"></div>
      <header class="sheet-header">
        <h2>阅读设置</h2>
        <button id="settings-close" class="icon-button" type="button" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="settings-body">
        <section class="settings-card">
          <div class="settings-card-head">
            <span>阅读</span>
          </div>
          <div class="setting-group">
            <span>模式</span>
            <div class="segmented" data-setting="mode">
              <button type="button" data-mode="scroll">滚动</button>
              <button type="button" data-mode="page">翻页</button>
            </div>
          </div>
          <div class="setting-group">
            <span>翻页</span>
            <div class="segmented" data-setting="animation">
              <button type="button" data-animation="slide">平移</button>
              <button type="button" data-animation="fade">淡入</button>
              <button type="button" data-animation="none">无动画</button>
            </div>
          </div>
        </section>

        <section class="settings-card">
          <div class="settings-card-head">
            <span>排版</span>
          </div>
          <div class="setting-group">
            <span>字号</span>
            <div class="stepper">
              <button id="font-dec" type="button">A-</button>
              <strong id="font-size-label">18</strong>
              <button id="font-inc" type="button">A+</button>
            </div>
          </div>
          <div class="setting-group">
            <span>行距</span>
            <div class="segmented" data-setting="line">
              <button type="button" data-line="0">紧凑</button>
              <button type="button" data-line="1">舒适</button>
              <button type="button" data-line="2">宽松</button>
            </div>
          </div>
          <div class="setting-group">
            <span>版心</span>
            <div class="segmented" data-setting="margin">
              <button type="button" data-margin="0">窄</button>
              <button type="button" data-margin="1">标准</button>
              <button type="button" data-margin="2">宽</button>
            </div>
          </div>
        </section>

        <section class="settings-card settings-card-theme">
          <div class="settings-card-head">
            <span>主题</span>
          </div>
          <div id="theme-options" class="theme-options"></div>
        </section>
      </div>
    </aside>

    <aside id="toc-sheet" class="side-sheet" aria-label="目录">
      <header class="sheet-header">
        <h2>目录</h2>
        <button id="toc-close" class="icon-button" type="button" aria-label="关闭目录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="toc-list" class="toc-list"></div>
    </aside>

    <div id="scrim" class="scrim"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="file-input" type="file" accept=".txt" hidden>
  </div>

  <script src="reader-core.js"></script>
  <script src="reader-app.js"></script>
</body>
</html>
