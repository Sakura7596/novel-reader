<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="reader-styles.css">
  <title>小说阅读器</title>
</head>
<body>
  <div id="app" class="app-shell">
    <main id="library-view" class="library-view">
      <header class="library-header">
        <div>
          <p class="eyebrow">本地书架</p>
          <h1>我的阅读</h1>
        </div>
        <div class="header-actions">
          <button id="search-btn" class="icon-button" type="button" aria-label="全文搜索">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
          </button>
          <button id="bookmarks-btn" class="icon-button" type="button" aria-label="书签与笔记">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-3-5 3V4z"/></svg>
          </button>
          <button id="import-btn" class="primary-button compact-import" type="button" aria-label="导入小说">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="more-btn" class="icon-button" type="button" aria-label="更多">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
        </div>
      </header>

      <section id="continue-card" class="continue-card hidden" aria-label="继续阅读"></section>

      <section class="section-head">
        <h2>书库</h2>
        <span class="section-stats"><span id="today-stats" class="today-stats hidden"></span><span id="book-count">0 本</span></span>
      </section>
      <section id="book-grid" class="book-grid"></section>
      <section id="empty-state" class="empty-state">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9a3 3 0 0 1 3 3v13H8a2 2 0 0 1-2-2V4z"/><path d="M8 18h10"/></svg>
        <h2>还没有书</h2>
        <p>导入 TXT 小说后，会自动识别章节并保存阅读进度。</p>
        <button id="empty-import-btn" class="primary-button" type="button">导入小说</button>
      </section>
    </main>

    <main id="reader-view" class="reader-view" aria-label="阅读器">
      <div id="reader-scroll" class="reader-scroll">
        <article id="reader-content" class="reader-content"></article>
      </div>
      <div id="reader-topbar" class="reader-topbar">
        <button id="back-btn" class="reader-control" type="button" aria-label="返回书架">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <div class="reader-title-wrap">
          <strong id="reader-book-title">未选择书籍</strong>
          <span id="reader-chapter-title">章节</span>
        </div>
        <div class="reader-top-actions">
          <span id="reader-clock" class="reader-clock" aria-hidden="true"></span>
          <button id="toc-btn" class="reader-control" type="button" aria-label="目录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
          </button>
        </div>
      </div>
      <div id="brightness-overlay" class="brightness-overlay" aria-hidden="true"></div>
      <div id="reader-bottombar" class="reader-bottombar">
        <button id="settings-btn" class="reader-control" type="button" aria-label="阅读设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h4M12 6h8M4 12h10M18 12h2M4 18h7M15 18h5"/><circle cx="10" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="13" cy="18" r="2"/></svg>
        </button>
        <button id="prev-btn" class="reader-control" type="button" aria-label="上一章或上一页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <div class="progress-area">
          <span id="progress-label">0%</span>
          <input id="progress-range" type="range" min="0" max="1000" value="0" aria-label="阅读进度">
        </div>
        <button id="next-btn" class="reader-control" type="button" aria-label="下一章或下一页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div id="page-indicator" class="page-indicator" aria-hidden="true"></div>
      <div id="selection-bubble" class="selection-bubble" role="toolbar" aria-label="文本操作" aria-hidden="true">
        <button id="selection-bookmark-btn" type="button">书签</button>
        <button id="selection-copy-btn" type="button">复制</button>
      </div>
    </main>

    <aside id="settings-sheet" class="bottom-sheet" role="dialog" aria-modal="true" aria-label="阅读设置">
      <div class="sheet-grabber"></div>
      <header class="sheet-header">
        <h2>阅读设置</h2>
        <button id="settings-close" class="icon-button" type="button" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="settings-body">
        <section class="settings-card">
          <div class="settings-card-head">
            <span>阅读</span>
          </div>
          <div class="setting-group">
            <span>模式</span>
            <div class="segmented" data-setting="mode">
              <button type="button" data-mode="scroll">滚动</button>
              <button type="button" data-mode="page">翻页</button>
            </div>
          </div>
          <div class="setting-group">
            <span>翻页</span>
            <div class="segmented" data-setting="animation">
              <button type="button" data-animation="slide">平移</button>
              <button type="button" data-animation="fade">淡入</button>
              <button type="button" data-animation="none">无</button>
            </div>
          </div>
          <div class="setting-group">
            <span>自动翻页</span>
            <div class="segmented" data-setting="autoscroll">
              <button type="button" data-autoscroll="off">关</button>
              <button type="button" data-autoscroll="slow">慢</button>
              <button type="button" data-autoscroll="normal">中</button>
              <button type="button" data-autoscroll="fast">快</button>
            </div>
          </div>
          <div class="setting-group">
            <span>音量键</span>
            <div class="segmented" data-setting="volume">
              <button type="button" data-volume="on">翻页</button>
              <button type="button" data-volume="off">调音量</button>
            </div>
          </div>
        </section>

        <section class="settings-card">
          <div class="settings-card-head">
            <span>排版</span>
          </div>
          <div class="setting-group">
            <span>字号</span>
            <div class="stepper">
              <button id="font-dec" type="button">A-</button>
              <strong id="font-size-label">18</strong>
              <button id="font-inc" type="button">A+</button>
            </div>
          </div>
          <div class="setting-group">
            <span>行距</span>
            <div class="segmented" data-setting="line">
              <button type="button" data-line="0">紧凑</button>
              <button type="button" data-line="1">舒适</button>
              <button type="button" data-line="2">宽松</button>
            </div>
          </div>
          <div class="setting-group">
            <span>版心</span>
            <div class="segmented" data-setting="margin">
              <button type="button" data-margin="0">窄</button>
              <button type="button" data-margin="1">标准</button>
              <button type="button" data-margin="2">宽</button>
            </div>
          </div>
          <div class="setting-group">
            <span>字体</span>
            <div class="segmented" data-setting="font">
              <button type="button" data-font="0">宋体</button>
              <button type="button" data-font="1">黑体</button>
              <button type="button" data-font="2">楷体</button>
            </div>
          </div>
          <div class="setting-group setting-group-wide">
            <span>亮度</span>
            <label class="brightness-field" aria-label="亮度调节">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
              <input id="brightness-range" type="range" min="40" max="100" step="5" value="100" aria-label="亮度">
            </label>
          </div>
        </section>

        <section class="settings-card settings-card-theme">
          <div class="settings-card-head">
            <span>主题与夜间</span>
          </div>
          <div id="theme-options" class="theme-options"></div>
          <div class="setting-group setting-group-wide">
            <span>夜间</span>
            <div class="segmented" data-setting="night">
              <button type="button" data-night="off">手动</button>
              <button type="button" data-night="system">跟随系统</button>
              <button type="button" data-night="timer">定时 21-7</button>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <aside id="toc-sheet" class="side-sheet" role="dialog" aria-modal="true" aria-label="目录">
      <header class="sheet-header">
        <h2>目录</h2>
        <button id="toc-close" class="icon-button" type="button" aria-label="关闭目录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <label class="toc-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <input id="toc-filter" type="search" maxlength="60" autocomplete="off" placeholder="搜索章节" aria-label="搜索章节">
      </label>
      <div id="toc-list" class="toc-list"></div>
    </aside>

    <section id="search-panel" class="feature-panel" role="dialog" aria-modal="true" aria-label="全文搜索" aria-hidden="true">
      <header class="feature-panel-header">
        <div>
          <p class="eyebrow">书库工具</p>
          <h2>全文搜索</h2>
        </div>
        <button id="search-close" class="icon-button" type="button" aria-label="关闭搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <form id="search-form" class="search-form">
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
          <input id="search-input" type="search" maxlength="80" autocomplete="off" placeholder="搜索书名、作者或正文" aria-label="搜索内容">
        </label>
        <button class="primary-button search-submit" type="submit" aria-label="搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        </button>
      </form>
      <p id="search-status" class="panel-status" role="status">输入关键词开始搜索</p>
      <div id="search-results" class="feature-list"></div>
    </section>

    <section id="bookmarks-panel" class="feature-panel" role="dialog" aria-modal="true" aria-label="书签与笔记" aria-hidden="true">
      <header class="feature-panel-header">
        <div>
          <p class="eyebrow">阅读收藏</p>
          <h2>书签与笔记</h2>
        </div>
        <button id="bookmarks-close" class="icon-button" type="button" aria-label="关闭书签">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <p id="bookmarks-status" class="panel-status"></p>
      <div id="bookmarks-list" class="feature-list"></div>
    </section>

    <aside id="book-actions" class="bottom-sheet action-sheet" role="dialog" aria-modal="true" aria-label="书籍操作" aria-hidden="true">
      <div class="sheet-grabber"></div>
      <header class="sheet-header">
        <div>
          <h2 id="book-actions-title">书籍操作</h2>
          <p id="book-actions-meta" class="sheet-subtitle"></p>
        </div>
        <button id="book-actions-close" class="icon-button" type="button" aria-label="关闭书籍操作">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="action-list">
        <button id="open-book-action" class="action-row" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          <span class="action-copy">
            <strong>继续阅读</strong>
            <span class="action-meta">回到上次保存的位置</span>
          </span>
        </button>
        <button id="delete-book-btn" class="action-row danger-action" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M10 11v6M14 11v6M9 7l1-2h4l1 2M8 7l1 13h6l1-13"/></svg>
          <span class="action-copy">
            <strong>删除这本书</strong>
            <span class="action-meta">同时移除书签和阅读进度</span>
          </span>
        </button>
      </div>
    </aside>

    <aside id="library-menu" class="bottom-sheet action-sheet" role="dialog" aria-modal="true" aria-label="书架工具" aria-hidden="true">
      <div class="sheet-grabber"></div>
      <header class="sheet-header">
        <div>
          <h2>书架工具</h2>
          <p class="sheet-subtitle">所有数据保存在本机，可随时备份</p>
        </div>
        <button id="library-menu-close" class="icon-button" type="button" aria-label="关闭书架工具">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="action-list">
        <button id="sort-mode-btn" class="action-row" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
          <span class="action-copy">
            <strong>排序方式</strong>
            <span id="sort-mode-label" class="action-meta">最近阅读</span>
          </span>
        </button>
        <button id="export-data-btn" class="action-row" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/></svg>
          <span class="action-copy">
            <strong>导出数据</strong>
            <span class="action-meta">备份书籍、书签与阅读进度（含正文）</span>
          </span>
        </button>
        <button id="import-data-btn" class="action-row" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 17v3h16v-3"/></svg>
          <span class="action-copy">
            <strong>导入备份</strong>
            <span class="action-meta">从备份文件恢复或合并书架</span>
          </span>
        </button>
        <button id="trash-btn" class="action-row" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M10 11v6M14 11v6M9 7l1-2h4l1 2M8 7l1 13h6l1-13"/></svg>
          <span class="action-copy">
            <strong>最近删除</strong>
            <span id="trash-count" class="action-meta">空</span>
          </span>
        </button>
      </div>
    </aside>

    <section id="trash-panel" class="feature-panel" role="dialog" aria-modal="true" aria-label="最近删除" aria-hidden="true">
      <header class="feature-panel-header">
        <div>
          <p class="eyebrow">可恢复</p>
          <h2>最近删除</h2>
        </div>
        <button id="trash-close" class="icon-button" type="button" aria-label="关闭最近删除">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <p id="trash-status" class="panel-status"></p>
      <div id="trash-list" class="feature-list"></div>
    </section>

    <div id="scrim" class="scrim"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="file-input" type="file" accept=".txt" hidden>
    <input id="backup-input" type="file" accept=".json,application/json" hidden>
  </div>

  <script src="reader-core.js"></script>
  <script src="reader-app.js"></script>
</body>
</html>
