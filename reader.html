// Delete confirmation
$('delete-confirm').addEventListener('click',()=>{$('delete-overlay').classList.remove('show');const idx=pendingDeleteIdx;if(idx<0)return;const deletedBook=state.books[idx];state.books.splice(idx,1);if(state.currentBookIdx===idx)state.currentBookIdx=-1;else if(state.currentBookIdx>idx)state.currentBookIdx--;if(deletedBook){state.bookmarks=state.bookmarks.filter(bm=>bm.bookId!==deletedBook.id);idbDeleteBook(deletedBook.id);}saveState();renderShelfGrid();renderBookmarks();if(state.books.length===0)readerView.classList.remove('active');showToast('已删除');pendingDeleteIdx=-1;});
$('delete-cancel').addEventListener('click',()=>{$('delete-overlay').classList.remove('show');pendingDeleteIdx=-1;});
$('delete-overlay').addEventListener('click',e=>{if(e.target===$('delete-overlay')){$('delete-overlay').classList.remove('show');pendingDeleteIdx=-1;}});

// Reader back
$('btn-back').addEventListener('click',()=>{
  clearTimeout(scrollSaveTimer);clearTimeout(_saveBookTimer);clearTimeout(_renderBatchTimer);
  _rendering=false;
  saveBookProgress(true);
  readerView.classList.remove('active');
  document.getElementById('tab-bar').style.display='flex';
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelector('.tab-item[data-tab="shelf"]').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-shelf').classList.add('active');
  renderShelfGrid();
});

// Swipe gesture for page mode
let swipeStartX=0,swipeStartY=0,swipeHandled=false;
readerScrollArea.addEventListener('touchstart',e=>{
  if(state.readingMode!=='page')return;
  const t=e.touches[0];swipeStartX=t.clientX;swipeStartY=t.clientY;swipeHandled=false;
},{passive:true});
readerScrollArea.addEventListener('touchmove',e=>{
  if(state.readingMode!=='page'||swipeHandled)return;
  const t=e.touches[0];const dx=t.clientX-swipeStartX;const dy=t.clientY-swipeStartY;
  if(Math.abs(dx)>20&&Math.abs(dx)>Math.abs(dy)){swipeHandled=true;e.preventDefault();}
},{passive:false});
readerScrollArea.addEventListener('touchend',e=>{
  if(state.readingMode!=='page'||!swipeHandled)return;
  const dx=e.changedTouches[0].clientX-swipeStartX;
  if(dx<-30)pageNext();
  else if(dx>30)pagePrev();
  swipeHandled=true;
  saveBookProgress();
},{passive:true});

// Tap zones — detected via scroll area click position
readerScrollArea.addEventListener('click',e=>{
  const sel=window.getSelection();
  if(sel&&!sel.isCollapsed)return; // text selection, ignore
  if(swipeHandled)return; // was a swipe, not a tap
  const rect=readerScrollArea.getBoundingClientRect();
  const w=rect.width;
  if(state.readingMode==='page'){
    const x=e.clientX-rect.left;
    if(x<w*0.4)pagePrev();
    else if(x>w*0.6)pageNext();
    else{
      state.toolbarVisible=!state.toolbarVisible;
      toolbarTop.classList.toggle('hidden',!state.toolbarVisible);
      toolbarBottom.classList.toggle('hidden',!state.toolbarVisible);
    }
  }else{
    const y=e.clientY-rect.top;
    const h=rect.height;
    if(y<h*0.3)scrollByAmount(-window.innerHeight*0.85);
    else if(y>h*0.7)scrollByAmount(window.innerHeight*0.85);
    else{
      state.toolbarVisible=!state.toolbarVisible;
      toolbarTop.classList.toggle('hidden',!state.toolbarVisible);
      toolbarBottom.classList.toggle('hidden',!state.toolbarVisible);
    }
  }
});

// Chapter nav
$('btn-prev-chapter').addEventListener('click',()=>{if(state.currentChapter>0)scrollToChapter(state.currentChapter-1);});
$('btn-next-chapter').addEventListener('click',()=>{const c=getChapters();if(state.currentChapter<c.length-1)scrollToChapter(state.currentChapter+1);});

// Progress drag
batteryBar.addEventListener('mousedown',startDrag);
batteryBar.addEventListener('touchstart',startDrag,{passive:true});
function startDrag(e){if(e.type==='mousedown'&&progressTouchHandled)return;progressDragging=true;updateProgressFromEvent(e);}
document.addEventListener('mousemove',e=>{if(!progressDragging)return;updateProgressFromEvent({clientX:e.clientX});});
document.addEventListener('mouseup',()=>{if(progressDragging){progressDragging=false;saveBookProgress();}});
let progressTouchHandled=false;
document.addEventListener('touchmove',e=>{if(!progressDragging)return;progressTouchHandled=true;updateProgressFromEvent({clientX:e.touches[0].clientX});},{passive:true});
document.addEventListener('touchend',()=>{if(progressDragging){progressDragging=false;saveBookProgress();}progressTouchHandled=true;setTimeout(()=>progressTouchHandled=false,500);});
function updateProgressFromEvent(e){
  const r=batteryBar.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  if(state.readingMode==='page'){
    const targetPage=Math.round(pct*(pageCount-1));
    state.currentPage=Math.max(0,Math.min(targetPage,pageCount-1));
    readerContent.style.transform='translateX(-'+state.currentPage*readerScrollArea.clientWidth+'px)';
  }else{
    const area=readerScrollArea;
    area.scrollTop=pct*(area.scrollHeight-area.clientHeight);
  }
  updateScrollProgress();
}

// Font settings
$('btn-font-settings').addEventListener('click',()=>{fontOverlay.classList.add('show');fontPanel.classList.add('show');});
fontOverlay.addEventListener('click',()=>{fontOverlay.classList.remove('show');fontPanel.classList.remove('show');});

// Theme dots (applySettings handles active states)
THEMES.forEach((t,i)=>{
  const d=document.createElement('div');
  d.className='theme-dot';
  d.style.background=t.id==='white'?'#FFFFFF':t.id==='cream'?'#F5F0E8':t.id==='gray'?'#F2F2F7':t.id==='eye'?'#C6E0B4':'#1C1C1E';
  const cc=i===4?'#FFFFFF':'#1C1C1E';
  d.innerHTML='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="'+cc+'"/></svg>';
  d.addEventListener('click',()=>{state.themeIdx=i;applySettings();saveState();});
  themeOpts.appendChild(d);
});

// Font size
$('font-dec').addEventListener('click',()=>{if(state.fontSize>14){state.fontSize--;applySettings();saveState();}});
$('font-inc').addEventListener('click',()=>{if(state.fontSize<28){state.fontSize++;applySettings();saveState();}});

// Line height
LINE_HEIGHTS.forEach((lh,i)=>{
  const b=document.createElement('button');
  b.className='line-height-btn lh-btn'+(i===state.lineHeightIdx?' active':'');
  b.textContent=lh.label;
  b.addEventListener('click',()=>{state.lineHeightIdx=i;applySettings();saveState();});
  lhOpts.appendChild(b);
});

// Font family
FONT_FAMILIES.forEach((ff,i)=>{
  const b=document.createElement('button');
  b.className='font-family-btn ff-btn'+(i===state.fontFamilyIdx?' active':'');
  b.textContent=ff.label;b.style.fontFamily=ff.val;
  b.addEventListener('click',()=>{state.fontFamilyIdx=i;applySettings();saveState();});
  ffOpts.appendChild(b);
});

// Page width
const pwOpts=$('pw-options');
PAGE_WIDTHS.forEach((pw,i)=>{
  const b=document.createElement('button');
  b.className='pw-btn'+(i===state.pageWidthIdx?' active':'');
  b.textContent=pw.label;
  b.addEventListener('click',()=>{state.pageWidthIdx=i;applySettings();saveState();});
  pwOpts.appendChild(b);
});

// Reading mode buttons
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    if (mode === state.readingMode) return;
    const prevChapter = state.currentChapter;
    state.readingMode = mode;
    state.currentPage = 0;
    applySettings();
    saveState();
    // Re-render if reader is open, restore chapter position
    if (state.currentBookIdx >= 0 && readerView.classList.contains('active')) {
      state.currentChapter = prevChapter;
      renderContent();
      // scroll→page: renderPageContent already called by renderContent, chapter preserved
      // page→scroll: scroll to the current chapter after layout
      if (mode === 'scroll') {
        requestAnimationFrame(() => requestAnimationFrame(() => scrollToChapter(prevChapter)));
      }
      if (mode === 'page' && !localStorage.getItem('pageGuideSeen')) {
        const guide = $('page-guide');
        guide.style.display = 'block';
        setTimeout(() => { guide.style.display = 'none'; }, 3000);
        localStorage.setItem('pageGuideSeen', '1');
      }
    }
  });
});

// TOC
$('btn-toc').addEventListener('click',()=>{
  tocOverlay.classList.add('show');tocPanel.classList.add('show');
  const chapters=getChapters();
  tocList.innerHTML=chapters.map((ch,i)=>`<button class="toc-item${i===state.currentChapter?' current':''}" data-idx="${i}">${ch.title}</button>`).join('');
  tocList.querySelectorAll('.toc-item').forEach(el=>{
    el.addEventListener('click',()=>{
      tocOverlay.classList.remove('show');tocPanel.classList.remove('show');
      scrollToChapter(parseInt(el.dataset.idx));
    });
  });
});
tocOverlay.addEventListener('click',()=>{tocOverlay.classList.remove('show');tocPanel.classList.remove('show');});

// Search
$('btn-search').addEventListener('click',()=>{
  searchOverlay.classList.add('show');
  setTimeout(()=>searchInput.focus(),100);
});
$('search-cancel').addEventListener('click',closeSearch);
let searchDebounce;
searchInput.addEventListener('input',()=>{
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(()=>performSearch(searchInput.value),200);
});
searchInput.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();});

// Text selection
let selTimer=null;
document.addEventListener('mouseup',e=>{
  if(!readerView.classList.contains('active'))return;
  clearTimeout(selTimer);
  selTimer=setTimeout(()=>{
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed||!sel.toString().trim()){contextBubble.classList.remove('show');return;}
    const text=sel.toString().trim();
    if(text.length===0){contextBubble.classList.remove('show');return;}
    // Only allow bookmarking text from actual book content, not UI elements
    if(!readerContent.contains(sel.anchorNode)){contextBubble.classList.remove('show');return;}
    const r=sel.getRangeAt(0).getBoundingClientRect();
    const cx=(r.left+r.right)/2;
    contextBubble.style.left=Math.max(16,Math.min(window.innerWidth-160,cx-60))+'px';
    contextBubble.style.top=Math.max(8,r.top-44)+'px';
    contextBubble.dataset.text=text;
    contextBubble.classList.add('show');
  },200);
});
document.addEventListener('mousedown',e=>{if(contextBubble.classList.contains('show')&&!contextBubble.contains(e.target))contextBubble.classList.remove('show');});
document.addEventListener('touchstart',e=>{if(contextBubble.classList.contains('show')&&!contextBubble.contains(e.target))contextBubble.classList.remove('show');});
contextBubble.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const text=contextBubble.dataset.text||'';
    if(btn.dataset.action==='bookmark'){addBookmark(text);}
    else if(btn.dataset.action==='copy'){
      navigator.clipboard.writeText(text).then(()=>showToast('已复制')).catch(()=>{
        const ta=document.createElement('textarea');ta.value=text;
        document.body.appendChild(ta);ta.select();document.execCommand('copy');
        document.body.removeChild(ta);showToast('已复制');
      });
    }
    contextBubble.classList.remove('show');
    window.getSelection()?.removeAllRanges();
  });
});

// Keyboard
document.addEventListener('keydown',e=>{
  // If any overlay is open, Escape should close it, not exit reader
  if(e.key==='Escape'){
    if(searchOverlay.classList.contains('show')){closeSearch();return;}
    if(fontOverlay.classList.contains('show')){fontOverlay.classList.remove('show');fontPanel.classList.remove('show');return;}
    if(tocOverlay.classList.contains('show')){tocOverlay.classList.remove('show');tocPanel.classList.remove('show');return;}
    if(actionOverlay.classList.contains('show')){actionOverlay.classList.remove('show');actionSheet.classList.remove('show');return;}
  }
  if(readerView.classList.contains('active')){
    if(state.readingMode==='page'){
      if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();pagePrev();}
      else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();pageNext();}
      else if(e.key==='Escape')$('btn-back').click();
    }else{
      if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')scrollByAmount(-window.innerHeight*0.85);
      else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'||e.key===' '){e.preventDefault();scrollByAmount(window.innerHeight*0.85);}
      else if(e.key==='Escape')$('btn-back').click();
    }
  }
});

// Scroll progress
let scrollSaveTimer;
readerScrollArea.addEventListener('scroll',()=>{
  if(_rendering)return;
  if(state.currentBookIdx>=0)updateScrollProgress();
  if(state.readingMode!=='page'){
    clearTimeout(scrollSaveTimer);
    scrollSaveTimer=setTimeout(()=>saveBookProgress(),800);
  }
});

// Resize
let rzTimer;
window.addEventListener('resize',()=>{clearTimeout(rzTimer);rzTimer=setTimeout(()=>{if(readerView.classList.contains('active')&&state.currentBookIdx>=0){if(state.readingMode==='page'&&getChapters().length>0)renderPageContent();updateScrollProgress();}},300);});

// Save progress on close — use sync localStorage for reliable unload save
window.addEventListener('beforeunload',()=>{
  const b=getBook();
  if(state.currentBookIdx>=0&&b){
    const pos={chapter:state.currentChapter,scrollPercent:state.scrollPercent||0,currentPage:state.currentPage||0,readingMode:state.readingMode||'scroll'};
    try{localStorage.setItem('novelReader_book_'+b.id,JSON.stringify(pos));}catch(e){}
  }
});

/* ===== Init ===== */
(async function(){
  importProgress.classList.add('show');
  $('import-msg').textContent='正在加载数据…';
  await new Promise(r=>setTimeout(r,16)); // yield to show loading indicator
  await loadStateAsync();
  applySettings();
  if(state.books.length===0){
    // Add demo book
    const demo={...DEMO_BOOK,coverUrl:'',chapters:DEMO_BOOK.chapters.map(c=>({...c}))};
    state.books.push(demo);
    saveState();
    tryFetchCover(0);
  }
  renderShelfGrid();
  renderBookmarks();
  importProgress.classList.remove('show');
  // Android back button: reader mode → back to bookshelf, else exit
  if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){
    window.Capacitor.Plugins.App.addListener('backButton',()=>{
      if(readerView.classList.contains('active')){
        $('btn-back').click();
      }else if(fontOverlay.classList.contains('show')){
        fontOverlay.classList.remove('show');fontPanel.classList.remove('show');
      }else if(tocOverlay.classList.contains('show')){
        tocOverlay.classList.remove('show');tocPanel.classList.remove('show');
      }else if(actionOverlay.classList.contains('show')){
        actionOverlay.classList.remove('show');actionSheet.classList.remove('show');
      }else{
        window.Capacitor.Plugins.App.exitApp();
      }
    });
  }
  console.log('📖 小说阅读器已加载，支持导入 .txt 小说');
})();
</script>
